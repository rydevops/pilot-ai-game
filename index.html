<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forest Duel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forest Duel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f4a35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face { font-family: "Press Start 2P"; src: url("press-start-2p.woff2") format("woff2"); font-display: swap; }
</style>
</head>
<body>
<style>
  /* Layout: a pixel-art forest fills the screen behind everything. Health and mana panels sit across the top, the arena is
     centred in the remaining space and lines up with the clearing, and the battle log and rematch sit at the bottom.
     A transparent effects canvas covers the whole screen for spells. */
  :root {
    --bg: #1f4a35;
    --ink: #241a38; --panel: #1c1530;
    --hi: #47d16c; --mid: #f6c940; --lo: #e8483f; --gold: #f6c940; --mana: #4aa3ff;
    --pix: "Press Start 2P", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html { background: var(--bg); box-sizing: border-box; overflow: hidden; }
  html, body { height: 100%; }
  body {
    margin: 0;
    box-sizing: border-box;
    background: var(--bg);
    color: #ffffff;
    font-family: var(--pix);
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: 12px;
    touch-action: manipulation;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #bg { position: fixed; left: 0; top: 0; z-index: 0; image-rendering: pixelated; pointer-events: none; }
  #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
  #stage {
    position: relative;
    z-index: 1;
    height: 100%;
    max-width: 560px;
    margin-inline: auto;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 12px;
  }

  .huds { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .hud, .log {
    background: var(--panel);
    color: #ffffff;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .hud { padding: 9px 10px 10px; min-width: 0; }
  .hud h2 { margin: 0 0 7px; font: 400 11px/1 var(--pix); letter-spacing: 0.06em; white-space: nowrap; }
  .bar {
    position: relative;
    height: 14px;
    border: 2px solid var(--ink);
    background: #3a2f55;
    overflow: hidden;
  }
  .bar.mpbar { height: 10px; margin-top: 9px; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; display: block; width: 100%; }
  .trail { background: #ffffff; opacity: 0.9; transition: width 0.7s linear 0.35s; }
  .fill { transition: width 0.3s ease-out; box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.3); }
  .fill[data-level="hi"] { background: var(--hi); }
  .fill[data-level="mid"] { background: var(--mid); }
  .fill[data-level="lo"] { background: var(--lo); }
  .fill.mpfill { background: var(--mana); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35); }
  .hp { margin: 7px 0 0; font: 400 10px/1 var(--pix); display: flex; justify-content: space-between; gap: 6px; }
  .hp.mp { margin-top: 6px; }
  .hp.mp b { color: #9bd0ff; }
  .hp span { white-space: nowrap; }
  .hud[data-level="lo"] .hp b#hHp, .hud[data-level="lo"] .hp b#gHp { color: #ff8a80; }
  .chips { display: flex; gap: 5px; margin-top: 9px; }
  .chip {
    font: 400 8px/1 var(--pix);
    color: var(--ink);
    background: var(--c, #fff);
    border: 2px solid var(--ink);
    padding: 4px 4px 4px 5px;
    white-space: nowrap;
    transition: opacity 0.2s, filter 0.2s;
  }
  .chip small { font: inherit; margin-left: 3px; opacity: 0.8; }
  .chip.off { opacity: 0.28; filter: grayscale(0.85); }
  .chip.used { animation: chipUsed 0.5s steps(5); }
  @keyframes chipUsed { 0% { transform: translateY(0); } 30% { transform: translateY(-4px); } 100% { transform: translateY(0); } }

  .arena { position: relative; place-self: center; }
  #cv { display: block; image-rendering: pixelated; }
  .pop {
    position: absolute;
    font: 400 16px/1 var(--pix);
    color: #ffffff;
    text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink);
    pointer-events: none;
    white-space: nowrap;
    z-index: 4;
    animation: rise 0.95s steps(10) forwards;
  }
  .pop.crit { color: var(--gold); font-size: 20px; }
  .pop.miss { color: #cfe6ff; font-size: 13px; }
  @keyframes rise {
    from { opacity: 1; transform: translate(-50%, 0); }
    to { opacity: 0; transform: translate(-50%, -46px); }
  }
  @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pop { animation-name: fade; } }

  .bubble {
    position: absolute;
    z-index: 3;
    transform: translate(-50%, -100%);
    background: var(--bub, #ffffff);
    color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 7px 9px 6px;
    font: 400 10px/1 var(--pix);
    letter-spacing: 0.04em;
    white-space: nowrap;
    pointer-events: none;
    animation: bubIn 0.24s steps(4) both;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -15px;
    margin-left: -7px;
    border: 7px solid transparent;
    border-bottom: 0;
    border-top-color: var(--ink);
  }
  .bubble::before {
    content: "";
    position: absolute;
    z-index: 1;
    left: 50%; bottom: -8px;
    margin-left: -4px;
    border: 4px solid transparent;
    border-bottom: 0;
    border-top-color: var(--bub, #ffffff);
  }
  @keyframes bubIn {
    from { transform: translate(-50%, -100%) scale(0.2); }
    to { transform: translate(-50%, -100%) scale(1); }
  }
  .banner {
    position: absolute;
    left: 0; right: 0; top: 0;
    margin: 0;
    text-align: center;
    font: 400 20px/1.3 var(--pix);
    color: var(--gold);
    z-index: 4;
    text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 3px 3px 0 var(--ink), -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink);
  }

  .foot { display: grid; gap: 10px; }
  .slot { height: 54px; display: grid; }
  .cmd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .cmd[hidden], #again[hidden] { display: none; }
  .cbtn {
    font: 400 8px/1 var(--pix);
    color: var(--ink);
    background: var(--c, #fff);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 0 2px;
    min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
    cursor: pointer;
    transition: opacity 0.15s, filter 0.15s;
  }
  .cbtn b { font: 400 9px/1 var(--pix); letter-spacing: 0.02em; }
  .cbtn small { font: 400 8px/1 var(--pix); opacity: 0.75; }
  .cbtn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .cbtn:focus-visible { outline: 3px solid #ffffff; outline-offset: 2px; }
  .cbtn:disabled { background: #5d5775; color: #2f2745; cursor: default; box-shadow: none; transform: translate(3px, 3px); }
  .cbtn:disabled small { opacity: 0.7; }
  .cmd.ready .cbtn:not(:disabled) { animation: nudge 0.9s steps(2) infinite; }
  .cmd.ready .cbtn:not(:disabled):nth-child(2) { animation-delay: 0.1s; }
  .cmd.ready .cbtn:not(:disabled):nth-child(3) { animation-delay: 0.2s; }
  .cmd.ready .cbtn:not(:disabled):nth-child(4) { animation-delay: 0.3s; }
  @keyframes nudge { 0% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { .cmd.ready .cbtn:not(:disabled) { animation: none; } }
  .btns { display: flex; gap: 8px; }
  #mode, #snd {
    font: 400 8px/1 var(--pix);
    color: var(--ink);
    background: #ffffff;
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 9px 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  #snd.off { background: #b9b3c9; color: #5a4f73; }
  #mode:active, #snd:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  #mode:focus-visible, #snd:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }

  .log {
    margin: 0;
    padding: 12px;
    height: 80px;
    box-sizing: border-box;
    overflow: hidden;
    display: flex;
    align-items: center;
    font: 400 11px/1.6 var(--pix);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 34px; padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: content-box; }
  .score {
    margin: 0;
    color: #ffffff;
    font: 400 9px/1.6 var(--pix);
    letter-spacing: 0.04em;
    text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink);
  }
  #again {
    font: 400 11px/1 var(--pix);
    color: var(--ink);
    background: var(--gold);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    width: 100%;
    height: 54px;
    padding: 0 12px;
    cursor: pointer;
  }
  #again:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  #again:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }

  /* Landscape phones: short and wide. Health panels sit above each fighter, the arena takes the middle, and the
     bottom bar holds the move buttons (left) and the battle log (right). Score and switches sit between the panels. */
  @media (orientation: landscape) and (max-height: 520px) {
    body { padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
    #stage {
      max-width: 720px;
      gap: 10px;
      grid-template-columns: minmax(0, 1fr) 140px minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) 56px;
      grid-template-areas: "hh mid hg" "arena arena arena" "cmd cmd log";
    }
    .huds, .foot { display: contents; }
    #hudHero { grid-area: hh; align-self: start; }
    #hudGob { grid-area: hg; align-self: start; }
    .arena { grid-area: arena; }
    .slot { grid-area: cmd; height: 56px; }
    .log { grid-area: log; height: 56px; padding: 6px 10px; font-size: 9px; line-height: 1.45; }
    .row { grid-area: mid; align-self: start; flex-direction: column; align-items: stretch; justify-content: flex-start; height: auto; padding: 0; gap: 8px; }
    .score { font-size: 8px; line-height: 1.5; text-align: center; }
    .btns { gap: 6px; }
    #mode, #snd { flex: 1; min-width: 0; padding: 8px 2px; }
    #snd #sndV { display: none; }
    #snd.off .lb { text-decoration: line-through; }
    #mode .lb { display: none; }
    #again, .cbtn { height: 56px; }

    .hud { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 8px; row-gap: 5px; align-items: center; padding: 7px 10px 8px; }
    .hud h2 { grid-column: 1 / 3; grid-row: 1; margin: 0; font-size: 10px; min-height: 17px; display: flex; align-items: center; }
    .hud#hudHero .chips { display: none; }
    .hud .chips { grid-column: 2 / 4; grid-row: 1; justify-content: flex-end; margin: 0; gap: 4px; }
    .hud .bar { grid-column: 2; grid-row: 2; margin: 0; height: 11px; }
    .hud .bar.mpbar { grid-row: 3; height: 8px; margin: 0; }
    .hud .hp, .hud .hp.mp { display: contents; }
    .hud .hp > span:first-child { grid-column: 1; grid-row: 2; font-size: 9px; }
    .hud .hp > span:last-child { grid-column: 3; grid-row: 2; justify-self: end; font-size: 9px; }
    .hud .hp.mp > span:first-child, .hud .hp.mp > span:last-child { grid-row: 3; }
  }
  @media (orientation: landscape) and (max-height: 520px) and (max-width: 740px) {
    .hud .chips { display: none; }
  }
</style>

<canvas id="bg" aria-hidden="true"></canvas>

<main id="stage">
  <header class="huds" id="huds">
    <section class="hud" id="hudHero" data-level="hi" aria-label="Hero health and mana">
      <h2>HERO</h2>
      <div class="bar" id="hBar" role="progressbar" aria-label="Hero HP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="trail" id="hTrail"></i><i class="fill" id="hFill" data-level="hi"></i></div>
      <p class="hp"><span>HP</span><span><b id="hHp">100</b> / <span id="hMax">100</span></span></p>
      <div class="bar mpbar" id="hMpBar" role="progressbar" aria-label="Hero MP" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60"><i class="trail" id="hMpTrail"></i><i class="fill mpfill" id="hMpFill"></i></div>
      <p class="hp mp"><span>MP</span><span><b id="hMp">60</b> / <span id="hMpMax">60</span></span></p>
      <div class="chips" id="hChips"></div>
    </section>
    <section class="hud" id="hudGob" data-level="hi" aria-label="Fire Goblin health and mana">
      <h2 id="gobName">FIRE GOBLIN</h2>
      <div class="bar" id="gBar" role="progressbar" aria-label="Fire Goblin HP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="trail" id="gTrail"></i><i class="fill" id="gFill" data-level="hi"></i></div>
      <p class="hp"><span>HP</span><span><b id="gHp">100</b> / <span id="gMax">100</span></span></p>
      <div class="bar mpbar" id="gMpBar" role="progressbar" aria-label="Fire Goblin MP" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60"><i class="trail" id="gMpTrail"></i><i class="fill mpfill" id="gMpFill"></i></div>
      <p class="hp mp"><span>MP</span><span><b id="gMp">60</b> / <span id="gMpMax">60</span></span></p>
      <div class="chips" id="gChips"></div>
    </section>
  </header>

  <div class="arena" id="arena">
    <canvas id="cv" role="img" aria-label="A pixel-art hero and a fire goblin casting spells in a forest clearing"></canvas>
    <p class="banner" id="banner" hidden></p>
  </div>

  <footer class="foot" id="foot">
    <p class="log" id="log" role="status" aria-live="polite">Loading sprites</p>
    <div class="slot">
      <div class="cmd" id="cmd" role="group" aria-label="Your moves"></div>
      <button id="again" type="button" hidden>Fight again</button>
    </div>
    <div class="row" id="ctl">
      <p class="score" id="score">Won 0 / Lost 0</p>
      <div class="btns">
        <button id="snd" type="button" aria-label="Sound effects on or off"><span class="lb">SFX</span><span id="sndV">: ON</span></button>
        <button id="mode" type="button" aria-label="Switch between playing yourself and watching an auto battle"><span class="lb">MODE: </span><span id="modeV">YOU</span></button>
      </div>
    </div>
  </footer>
</main>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function () {
  'use strict';
  const CELL = 32;
  const MAX_HP = 100, MAX_MP = 60, DMG_MIN = 8, DMG_MAX = 18;
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const arena = $('arena'), stage = $('stage'), banner = $('banner');
  const logEl = $('log'), scoreEl = $('score'), againBtn = $('again'), cmdEl = $('cmd'), modeBtn = $('mode');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const LAND = '(orientation: landscape) and (max-height: 520px)';
  const isLand = function () { return !!(window.matchMedia && matchMedia(LAND).matches); };

  // ====================================================================
  //  Spells
  // ====================================================================
  const SPELLS = {
    hero: [
      { id: 'fire', name: 'Fire', shout: 'FIREBALL!', chip: 'F', cost: 10, min: 15, max: 24, rgb: [255, 150, 50], bub: '#ffb347', settle: 650 },
      { id: 'ice', name: 'Ice', shout: 'FROST LANCE!', chip: 'I', cost: 12, min: 14, max: 22, rgb: [120, 222, 255], bub: '#bfefff', settle: 800 },
      { id: 'bolt', name: 'Lightning', shout: 'THUNDER!', chip: 'L', cost: 18, min: 22, max: 32, rgb: [255, 238, 110], bub: '#fff27a', settle: 650 }
    ],
    gob: [
      { id: 'fireball', name: 'Fireball', shout: 'FIREBALL!', chip: 'F', cost: 8, min: 14, max: 22, rgb: [255, 130, 40], bub: '#ffb347', settle: 650 },
      { id: 'wave', name: 'Flame Wave', shout: 'FLAME WAVE!', chip: 'W', cost: 14, min: 18, max: 26, rgb: [255, 95, 35], bub: '#ff9b5e', settle: 800 },
      { id: 'meteor', name: 'Meteor', shout: 'METEOR!', chip: 'M', cost: 24, min: 28, max: 38, rgb: [255, 70, 30], bub: '#ff7a5c', settle: 1100 }
    ],
    teacher: [
      { id: 'quiz', name: 'Pop Quiz', shout: 'POP QUIZ!', chip: 'P', cost: 10, min: 14, max: 22, rgb: [255, 236, 150], bub: '#fff3b0', settle: 950 },
      { id: 'detention', name: 'Detention', shout: 'DETENTION!', chip: 'D', cost: 20, min: 8, max: 14, rgb: [180, 130, 255], bub: '#d9c2ff', settle: 1000, status: 'detain' }
    ]
  };
  // what the target looks like when a spell lands
  const IMPACT = {
    fire:     { tint: 'burn',  ms: 900, flash: 'rgba(255,215,150,0.85)' },
    fireball: { tint: 'burn',  ms: 900, flash: 'rgba(255,215,150,0.85)' },
    wave:     { tint: 'burn',  ms: 1000, flash: 'rgba(255,200,130,0.85)' },
    meteor:   { tint: 'blast', ms: 1000, flash: 'rgba(255,235,190,0.9)' },
    ice:      { tint: 'ice',   ms: 560, flash: 'rgba(205,246,255,0.85)' },
    bolt:     { tint: 'shock', ms: 420, flash: 'rgba(255,255,225,0.9)' },
    quiz:     { tint: 'ink',   ms: 800, flash: 'rgba(255,255,255,0.85)' },
    detention: { tint: 'detain', ms: 1e9, flash: 'rgba(220,200,255,0.85)' }
  };

  // ====================================================================
  //  Sound: every effect is synthesised with Web Audio (no audio files).
  //  Times are seconds from the moment the matching visual starts.
  // ====================================================================
  const SFX = (function () {
    let ac = null, master = null, white = null, brown = null, on = true;
    try { on = localStorage.getItem('fd-sfx') !== 'off'; } catch (e) {}

    function build(c) {
      ac = c;
      master = ac.createGain();
      master.gain.value = 0.55;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.2;
      master.connect(comp); comp.connect(ac.destination);
      const sr = ac.sampleRate, len = Math.floor(sr * 2);
      white = ac.createBuffer(1, len, sr); brown = ac.createBuffer(1, len, sr);
      const w = white.getChannelData(0), b = brown.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { const x = Math.random() * 2 - 1; w[i] = x; last = (last + 0.02 * x) / 1.02; b[i] = last * 3.5; }
    }
    // iOS only lets audio start from a tap, so this runs on the first touch or key press
    function ensure() {
      if (!on) return null;
      if (!ac) {
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { build(new AC()); } catch (e) { ac = null; return null; }
      }
      if (ac.state === 'suspended' && ac.resume && !ac.startRendering) { try { ac.resume(); } catch (e) {} }
      return ac;
    }

    function env(g, t, v, a, d, swell) {
      g.gain.setValueAtTime(0.0001, t);
      if (swell) {
        g.gain.exponentialRampToValueAtTime(v, t + d * 0.92);
      } else {
        g.gain.linearRampToValueAtTime(v, t + Math.min(a, d * 0.5));
      }
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    }
    // oscillator: f is a number or [from, to] (exponential glide)
    function T(o) {
      const c = ensure(); if (!c) return;
      const t = c.currentTime + (o.at || 0), d = o.d;
      const f0 = Array.isArray(o.f) ? o.f[0] : o.f, f1 = Array.isArray(o.f) ? o.f[1] : o.f;
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t + d);
      env(g, t, o.v, o.a || 0.005, d, o.swell);
      osc.connect(g); g.connect(master);
      osc.start(t); osc.stop(t + d + 0.05);
    }
    // filtered noise: f is a number or [from, to] filter sweep
    function N(o) {
      const c = ensure(); if (!c) return;

  function drawScene(now) {

    lg.globalAlpha = 1;
    lg.globalCompositeOperation = 'source-over';
    lg.clearRect(0, 0, cols, rows);
    lg.drawImage(S.sky, 0, 0);

    S.clouds.forEach(function (c) {

      lg.drawImage(c.c, Math.round(x), c.y);
    });
    lg.fillStyle = '#243824';
    S.birds.forEach(function (b) {
      const cycle = (cols + 24) / b.v + b.gap;
      const ph = ((t + b.off) % cycle + cycle) % cycle;
      const x = ph * b.v - 12;
      if (x > cols + 6) return;
      const bx = Math.round(x), by = b.y + Math.round(Math.sin(t * 1.3 + b.off) * 2);

      lg.fillRect(u.x, u.y, 1, 3);
      lg.fillRect(u.x - 2, u.y + 1, 1, 2);
      lg.fillRect(u.x + 2, u.y + 1, 1, 2);
      lg.fillRect(u.x + sw, u.y - 1, 1, 1);
      lg.fillRect(u.x - 2 + sw, u.y, 1, 1);
      lg.fillRect(u.x + 2 + sw, u.y, 1, 1);
    });

    S.trees.forEach(function (tr) {
      const sw = Math.round(Math.sin(t * 0.8 + tr.ph) * tr.amp * swayOn);
      if (tr.tr) lg.drawImage(tr.tr.c, Math.round(tr.x - tr.tr.w / 2), tr.base - tr.trunkH);
      const cn = tr.cn;
      if (tr.kind === 'pine') {

      }
    });
    lg.globalAlpha = 1;

    S.leaves.forEach(function (l) {

      const n = 3;

        const an = rnd(0, TAU), d = rnd(7, 12) * dev, life = 0.28;

        addMode(); glow(cx, (y0 + y1) / 2, w * 0.9, '150,100,255', (0.17 + 0.07 * Math.sin(age * 5)) * keep); normMode();
        if (lift < 0 && Math.random() < 0.1) emit(cx + rnd(-w / 2, w / 2), rnd(y0, y1), { n: 1, sp: [2, 8], ang: [-Math.PI, 0], life: [0.4, 0.8], s: [1, 1.4], c0: [235, 220, 255], c1: [150, 100, 255], g: -6 });
        if (lift > 0 && Math.random() < 0.5) emit(cx + rnd(-w / 2, w / 2), rnd(y0, y1), { n: 1, sp: [10, 40], ang: [-Math.PI, 0], life: [0.3, 0.6], s: [1, 1.6], c0: [255, 255, 255], c1: [170, 120, 255], g: 40 });
        if (!o.res && t >= 0.17) { o.res = true; res(); }
      });
    });
  }

  const CAST_FX = {
    fire: function (a, d, sp) { return fireProjectile(a, d, sp, false); },
    fireball: function (a, d, sp) { return fireProjectile(a, d, sp, true); },
    ice: iceVolley, bolt: lightning, wave: flameWave, meteor: meteor,
    quiz: popQuiz, detention: detention
  };

  function stageShake(sx, sy) {
    const v = sx || sy ? 'translate(' + sx + 'px,' + sy + 'px)' : '';
    stage.style.transform = v;
    bgCv.style.transform = v;
  }
  function fxClear() {
    parts.length = 0; objs.length = 0; flashA = 0; dimA = 0; dimTarget = 0; shakeMag = 0;
    fg.setTransform(1, 0, 0, 1, 0, 0);
    fg.clearRect(0, 0, fxCv.width, fxCv.height);
    stageShake(0, 0);
  }
  function fxFrame(now) {
    const dt = Math.min(0.05, (now - fxLast) / 1000 || 0.016);
    fxLast = now;
    const active = objs.length || parts.length || flashA > 0.004 || dimA > 0.004 || dimTarget > 0 || shakeMag > 0.2;
    if (!active) {
      if (fxDirty) { fg.clearRect(0, 0, fxCv.width, fxCv.height); fxDirty = false; stageShake(0, 0); }
      return;
    }
    fxDirty = true;
    normMode();
    fg.clearRect(0, 0, fxCv.width, fxCv.height);
    dimA += (dimTarget - dimA) * Math.min(1, dt * 7);
    if (dimA > 0.004) { fg.fillStyle = 'rgba(' + dimRgb + ',' + dimA.toFixed(3) + ')'; fg.fillRect(0, 0, fxCv.width, fxCv.height); }

    for (let i = objs.length - 1; i >= 0; i--) {
      const o = objs[i];
      o.age += dt;
      const k = Math.min(1, o.age / o.life);
      o.fn(dt, o.age, k, o);
      normMode();
      if (o.age >= o.life) objs.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.age += dt;
      if (p.age >= p.life) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      const dr = Math.max(0, 1 - p.d * dt);
      p.vx *= dr; p.vy *= dr; p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let pass = 0; pass < 2; pass++) {
      fg.globalCompositeOperation = pass ? 'lighter' : 'source-over';
      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        if (p.add !== !!pass) continue;
        const t = p.age / p.life;
        const al = p.a * Math.pow(1 - t, 1.1);
        fg.fillStyle = 'rgba(' + Math.round(lerp(p.c0[0], p.c1[0], t)) + ',' + Math.round(lerp(p.c0[1], p.c1[1], t)) + ',' + Math.round(lerp(p.c0[2], p.c1[2], t)) + ',' + al.toFixed(3) + ')';
        const sz = Math.max(1, Math.round(p.s)) * fxPx;
        fg.fillRect(snap(p.x), snap(p.y), sz, sz);
      }
    }
    normMode();
    if (flashA > 0.004) {
      fg.fillStyle = 'rgba(' + flashRgb + ',' + Math.min(0.9, flashA).toFixed(3) + ')';
      fg.fillRect(0, 0, fxCv.width, fxCv.height);
      flashA = Math.max(0, flashA - dt * 3.2);
    }
    if (shakeMag > 0.2) {
      stageShake(Math.round(rnd(-shakeMag, shakeMag)), Math.round(rnd(-shakeMag, shakeMag)));
      shakeMag *= Math.pow(0.02, dt);
    } else if (shakeMag > 0) { shakeMag = 0; stageShake(0, 0); }
  }

  // ====================================================================
  //  Layout
  // ====================================================================
  function layout() {
    dpr = window.devicePixelRatio || 1;
    const aw = stage.clientWidth;
    let s = Math.floor(aw / 58);
    if (isLand()) {
      // wide and short: whatever height is left between the health panels and the bottom bar
      const availL = stage.clientHeight - Math.max($('hudHero').offsetHeight, $('ctl').offsetHeight) - 56 - 20;
      s = availL > 0 ? Math.max(3, Math.min(Math.floor(availL / CELL), 9)) : 4;
    } else {
      s = Math.max(3, Math.min(s, Math.floor((window.innerHeight * 0.36) / CELL)));
      const avail = stage.clientHeight - $('huds').offsetHeight - $('foot').offsetHeight - 32;   // keep the arena from squeezing small phones
      if (avail > 0) s = Math.max(3, Math.min(s, Math.floor(avail / CELL)));
    }
    if (s >= 4 && s % 2 === 1) s -= 1;            // keeps the forest pixel exactly half a fighter pixel
    dev = Math.max(1, Math.round(s * dpr));
    cv.width = Math.round(aw * dpr);
    cv.height = CELL * dev;
    cv.style.width = cv.width / dpr + 'px';
    cv.style.height = cv.height / dpr + 'px';
    arena.style.width = cv.style.width;
    ctx.imageSmoothingEnabled = false;

    // forest
    sdev = Math.max(1, Math.floor(dev / 2));
    fxPx = sdev;
    const W = Math.round(window.innerWidth * dpr), H = Math.round(window.innerHeight * dpr);
    fxCv.width = W; fxCv.height = H;
    const cols = Math.ceil(W / sdev), rows = Math.ceil(H / sdev);
    bgCv.width = cols * sdev; bgCv.height = rows * sdev;
    bgCv.style.width = bgCv.width / dpr + 'px'; bgCv.style.height = bgCv.height / dpr + 'px';
    L.width = cols; L.height = rows;
    const rect = cv.getBoundingClientRect();
    const fy = (rect.top * dpr + 28 * dev) / sdev;
    const cx = (rect.left + rect.width / 2) * dpr / sdev;
    const halfW = rect.width * dpr / sdev / 2;
    scene = buildScene(cols, rows, Math.round(fy), Math.round(cx), halfW);
  }
  let layoutQueued = false;
  function queueLayout() {
    if (layoutQueued) return;
    layoutQueued = true;
    requestAnimationFrame(function () { layoutQueued = false; layout(); });
  }

  // ====================================================================
  //  Battle
  // ====================================================================
  let ready = false, battleId = 0, countdown = null;
  const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms * (reduce ? 1.4 : 1)); }); };
  const say = function (t) { logEl.textContent = t; };

  // each turn: a random affordable spell most of the time, otherwise a plain strike
  function chooseSpell(a) {
    const opts = a.spells.filter(function (s) { return a.mp >= s.cost; });
    if (opts.length && Math.random() < 0.75) return opts[Math.floor(Math.random() * opts.length)];
    return null;
  }
  function rollDamage(lo, hi) {
    let dmg = lo + Math.floor(Math.random() * (hi - lo + 1)), kind = '';
    if (Math.random() < 0.12) { dmg = Math.round(dmg * 1.6); kind = 'crit'; }
    return { dmg: dmg, kind: kind };
  }
  function hit(def, dmg, kind, imp) {
    def.hp = Math.max(0, def.hp - dmg);
    SFX.grunt(def === hero ? 'hero' : def.voice);
    if (kind === 'crit') SFX.crit();
    if (def.hp <= 0) SFX.ko();
    renderBar(def);
    popup(def, '-' + dmg, kind);
    def.flashCol = imp ? imp.flash : null;
    def.tint = imp ? { mode: imp.tint, until: performance.now() + imp.ms, ms: imp.ms } : null;
    setAnim(def, def.hp > 0 ? 'hurt' : 'ko');
    if (def.hp > 0) {
      setTimeout(function () { if (def.anim === 'hurt') setAnim(def, 'idle'); }, 380);
    }
  }

  async function castTurn(atk, def, sp, alive) {
    atk.mp -= sp.cost;
    renderMp(atk);
    pulseChip(atk, sp.id);
    setAnim(atk, 'cast');
    showBubble(atk, sp);
    say(atk.name + ' casts ' + sp.name + '!');
    charge(atk, sp);
    SFX.charge(sp.id);
    await sleep(560); if (!alive()) return false;
    SFX.release(sp.id);
    await CAST_FX[sp.id](atk, def, sp); if (!alive()) return false;
    const r = rollDamage(sp.min, sp.max);
    hideBubble(atk);
    hit(def, r.dmg, r.kind, IMPACT[sp.id]);
    say(atk.name + '\'s ' + sp.name + ' hits ' + def.name + ' for ' + r.dmg + (r.kind === 'crit' ? ' - critical!' : '!'));
    if (sp.status === 'detain' && def.hp > 0) {
      def.detained = true;
      showBadge(def, 'DETENTION', sp.bub);
      say(def.name + ' is sent to detention and will lose the next turn!');
    }
    await sleep(sp.settle); if (!alive()) return false;
    hideBubble(atk);
    setAnim(atk, 'idle');
    return true;
  }

  async function meleeTurn(atk, def, alive) {
    setAnim(atk, 'attack');
    say(atk.melee === 'ruler' ? atk.name + ' swings his ruler!' : atk.name + ' attacks!');
    SFX.swing(0.1);
    await sleep(ATT[0] + ATT[1] + 40); if (!alive()) return false;
    if (Math.random() < 0.10) {
      def.shiftT = performance.now();
      SFX.miss();
      popup(def, 'MISS', 'miss');
      say(atk.name + ' misses! ' + def.name + ' dodges.');
    } else {
      const r = rollDamage(DMG_MIN, DMG_MAX);
      if (atk.melee === 'ruler') SFX.ruler(); else SFX.slash();
      hit(def, r.dmg, r.kind, null);
      say(atk.name + ' hits ' + def.name + ' for ' + r.dmg + (r.kind === 'crit' ? ' - critical!' : '!'));
    }
    await sleep(ATT[2] - 40 + ATT[3]); if (!alive()) return false;
    setAnim(atk, 'idle');
    return true;
  }

  // waits for a tap on the command bar; resolves with a spell, or null for a sword attack
  function askPlayer() {
    return new Promise(function (res) {
      say(hero.mp >= SPELLS.hero[0].cost ? 'Your turn! Strike with your sword or cast a spell.' : 'Your turn! Low on MP - strike with your sword.');
      pending = function (c) { pending = null; setCmd(false); res(c); };
      setCmd(true);
      SFX.ping();
    });
  }

  async function battle() {
    const id = ++battleId;
    const alive = function () { return id === battleId; };
    clearInterval(countdown);
    againBtn.hidden = true;
    cmdEl.hidden = false;
    pending = null; setCmd(false);
    banner.hidden = true;
    fxClear();
    const t = performance.now();
    actors.forEach(function (a) {
      a.hp = MAX_HP; a.shown = MAX_HP; a.mp = MAX_MP; a.shownMp = MAX_MP;
      a.anim = 'idle'; a.t0 = t; a.victory = false; a.shiftT = -1e9; a.tint = null; a.flashCol = null; a.detained = false;
      hideBubble(a); hideBadge(a); a.cageObj = null;
    });
    const mob = pickMob();
    applyMob(mob);
    resetBarsInstant();
    SFX.intro(mob.voice);

    let atk = Math.random() < 0.5 ? hero : gob;
    let def = atk === hero ? gob : hero;
    say(mob.intro);
    await sleep(1500); if (!alive()) return;
    say(atk === hero && mode === 'play' ? 'You go first!' : atk.name + ' goes first!');
    await sleep(1000); if (!alive()) return;

    for (;;) {
      if (atk.detained) {
        // detention costs a whole turn
        atk.detained = false; atk.tint = null;
        hideBadge(atk); cageOff(atk);
        SFX.detentionEnd();
        say(atk.name + ' is stuck in detention and loses the turn!');
        await sleep(1500); if (!alive()) return;
        const sw = atk; atk = def; def = sw;
        continue;
      }
      let sp;
      if (atk === hero && mode === 'play') {
        sp = await askPlayer(); if (!alive()) return;
      } else {
        sp = chooseSpell(atk);
      }
      if (sp) {
        if (!(await castTurn(atk, def, sp, alive))) return;
      } else if (!(await meleeTurn(atk, def, alive))) {
        return;
      }
      if (def.hp <= 0) break;
      await sleep(750); if (!alive()) return;
      const swap = atk; atk = def; def = swap;
    }

    await sleep(900); if (!alive()) return;
    atk.victory = true; atk.t0 = performance.now(); atk.wins++;
    banner.textContent = mode === 'play' ? (atk === hero ? 'YOU WIN!' : 'YOU LOSE!') : atk.name.toUpperCase() + ' WINS!';
    banner.hidden = false;
    if (atk === hero) SFX.win(); else SFX.lose();
    say(def.name + ' is defeated. ' + atk.name + ' wins with ' + atk.hp + ' HP left!');
    scoreEl.textContent = 'Won ' + hero.wins + ' / Lost ' + gob.wins;
    cmdEl.hidden = true;
    againBtn.hidden = false;
    if (mode === 'play') {
      againBtn.textContent = 'Fight again';
    } else {
      let n = 8;
      againBtn.textContent = 'Fight again (' + n + ')';
      countdown = setInterval(function () {
        n--;
        if (n <= 0) { clearInterval(countdown); battle(); } else { againBtn.textContent = 'Fight again (' + n + ')'; }
      }, 1000);
    }
  }
  againBtn.addEventListener('click', function () { SFX.click(); battle(); });

  // ====================================================================
  //  Main loop
  // ====================================================================
  let lastBg = -1e9;
  function tick(now) {
    actors.forEach(function (a) {
      a.shown += (a.hp - a.shown) * 0.2;
      if (Math.abs(a.hp - a.shown) < 0.5) a.shown = a.hp;
      const txt = String(Math.round(a.shown));
      if (a.hud.hp.textContent !== txt) a.hud.hp.textContent = txt;
      a.shownMp += (a.mp - a.shownMp) * 0.2;
      if (Math.abs(a.mp - a.shownMp) < 0.5) a.shownMp = a.mp;
      const mt = String(Math.round(a.shownMp));
      if (a.hud.mp.textContent !== mt) a.hud.mp.textContent = mt;
    });

    if (now - lastBg >= 33) { lastBg = now; drawScene(now); }

    if (ready) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      actors.forEach(drawShadow);
      actors.slice().sort(function (x, y) { return ((x.anim === 'attack' || x.anim === 'cast') ? 1 : 0) - ((y.anim === 'attack' || y.anim === 'cast') ? 1 : 0); })
        .forEach(function (a) { drawActor(a, now); });
    }
    fxFrame(now);
    requestAnimationFrame(tick);
  }

  function loaded(img) {
    return new Promise(function (res, rej) {
      if (img.complete && img.naturalWidth) res();
      else { img.onload = res; img.onerror = function () { rej(new Error('image')); }; }
    });
  }

  layout();
  window.addEventListener('resize', queueLayout);
  window.addEventListener('orientationchange', queueLayout);
  window.addEventListener('load', queueLayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueLayout);
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(queueLayout);
    ro.observe($('huds')); ro.observe($('foot')); ro.observe($('hudHero')); ro.observe($('ctl'));
  }
  if (window.matchMedia) {
    const mq = matchMedia(LAND);
    if (mq.addEventListener) mq.addEventListener('change', queueLayout);
  }
  if (window.__duelDebug) window.__duelDebug({ MOBS: MOBS, applyMob: applyMob, force: function (k) { forcedMob = k; }, cageOff: cageOff, showBadge: showBadge, SFX: SFX, hero: hero, gob: gob, SPELLS: SPELLS, CAST_FX: CAST_FX, charge: charge, fxFrame: fxFrame, drawScene: drawScene, drawActor: drawActor, drawShadow: drawShadow, setAnim: setAnim, hit: hit, IMPACT: IMPACT, showBubble: showBubble, actors: actors, stop: function () { battleId++; clearInterval(countdown); }, setReady: function () { ready = true; }, getCv: function () { return cv; } });
  requestAnimationFrame(tick);
  Promise.all([loaded(heroImg), loaded(gobImg), loaded(teachImg).catch(function () { return null; })]).then(function () {
    ready = true;
    battle();
  }).catch(function () { say('The sprite sheets failed to load.'); });
})();
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
