<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forest Duel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forest Duel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f4a35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face { font-family: "Press Start 2P"; src: url("press-start-2p.woff2") format("woff2"); font-display: swap; }
</style>
</head>
<body>
<style>
  /* Layout: a pixel-art forest fills the screen behind everything. Health and mana panels sit across the top, the arena is
     centred in the remaining space and lines up with the clearing, and the battle log and rematch sit at the bottom.
     A transparent effects canvas covers the whole screen for spells. */
  :root {
    --bg: #1f4a35;
    --ink: #241a38; --panel: #1c1530;
    --hi: #47d16c; --mid: #f6c940; --lo: #e8483f; --gold: #f6c940; --mana: #4aa3ff;
    --pix: "Press Start 2P", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html { background: var(--bg); box-sizing: border-box; overflow: hidden; }
  html, body { height: 100%; }
  body {
    margin: 0;
    box-sizing: border-box;
    background: var(--bg);
    color: #ffffff;
    font-family: var(--pix);
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: 12px;
    touch-action: manipulation;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #bg { position: fixed; left: 0; top: 0; z-index: 0; image-rendering: pixelated; pointer-events: none; }
  #fx { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
  #stage {
    position: relative;
    z-index: 1;
    height: 100%;
    max-width: 560px;
    margin-inline: auto;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 12px;
  }

  .huds { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .hud, .log {
    background: var(--panel);
    color: #ffffff;
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
  }
  .hud { padding: 9px 10px 10px; min-width: 0; }
  .hud h2 { margin: 0 0 7px; font: 400 11px/1 var(--pix); letter-spacing: 0.06em; white-space: nowrap; }
  .bar {
    position: relative;
    height: 14px;
    border: 2px solid var(--ink);
    background: #3a2f55;
    overflow: hidden;
  }
  .bar.mpbar { height: 10px; margin-top: 9px; }
  .bar i { position: absolute; top: 0; bottom: 0; left: 0; display: block; width: 100%; }
  .trail { background: #ffffff; opacity: 0.9; transition: width 0.7s linear 0.35s; }
  .fill { transition: width 0.3s ease-out; box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.3); }
  .fill[data-level="hi"] { background: var(--hi); }
  .fill[data-level="mid"] { background: var(--mid); }
  .fill[data-level="lo"] { background: var(--lo); }
  .fill.mpfill { background: var(--mana); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35); }
  .hp { margin: 7px 0 0; font: 400 10px/1 var(--pix); display: flex; justify-content: space-between; gap: 6px; }
  .hp.mp { margin-top: 6px; }
  .hp.mp b { color: #9bd0ff; }
  .hp span { white-space: nowrap; }
  .hud[data-level="lo"] .hp b#hHp, .hud[data-level="lo"] .hp b#gHp { color: #ff8a80; }
  .chips { display: flex; gap: 5px; margin-top: 9px; }
  .chip {
    font: 400 8px/1 var(--pix);
    color: var(--ink);
    background: var(--c, #fff);
    border: 2px solid var(--ink);
    padding: 4px 4px 4px 5px;
    white-space: nowrap;
    transition: opacity 0.2s, filter 0.2s;
  }
  .chip small { font: inherit; margin-left: 3px; opacity: 0.8; }
  .chip.off { opacity: 0.28; filter: grayscale(0.85); }
  .chip.used { animation: chipUsed 0.5s steps(5); }
  @keyframes chipUsed { 0% { transform: translateY(0); } 30% { transform: translateY(-4px); } 100% { transform: translateY(0); } }

  .arena { position: relative; place-self: center; }
  #cv { display: block; image-rendering: pixelated; }
  .pop {
    position: absolute;
    font: 400 16px/1 var(--pix);
    color: #ffffff;
    text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink);
    pointer-events: none;
    white-space: nowrap;
    z-index: 4;
    animation: rise 0.95s steps(10) forwards;
  }
  .pop.crit { color: var(--gold); font-size: 20px; }
  .pop.miss { color: #cfe6ff; font-size: 13px; }
  @keyframes rise {
    from { opacity: 1; transform: translate(-50%, 0); }
    to { opacity: 0; transform: translate(-50%, -46px); }
  }
  @keyframes fade { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pop { animation-name: fade; } }

  .bubble {
    position: absolute;
    z-index: 3;
    transform: translate(-50%, -100%);
    background: var(--bub, #ffffff);
    color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 7px 9px 6px;
    font: 400 10px/1 var(--pix);
    letter-spacing: 0.04em;
    white-space: nowrap;
    pointer-events: none;
    animation: bubIn 0.24s steps(4) both;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -15px;
    margin-left: -7px;
    border: 7px solid transparent;
    border-bottom: 0;
    border-top-color: var(--ink);
  }
  .bubble::before {
    content: "";
    position: absolute;
    z-index: 1;
    left: 50%; bottom: -8px;
    margin-left: -4px;
    border: 4px solid transparent;
    border-bottom: 0;
    border-top-color: var(--bub, #ffffff);
  }
  @keyframes bubIn {
    from { transform: translate(-50%, -100%) scale(0.2); }
    to { transform: translate(-50%, -100%) scale(1); }
  }
  .banner {
    position: absolute;
    left: 0; right: 0; top: 0;
    margin: 0;
    text-align: center;
    font: 400 20px/1.3 var(--pix);
    color: var(--gold);
    z-index: 4;
    text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 3px 3px 0 var(--ink), -3px -3px 0 var(--ink), 3px -3px 0 var(--ink), -3px 3px 0 var(--ink);
  }

  .foot { display: grid; gap: 14px; }
  .log {
    margin: 0;
    padding: 12px;
    height: 80px;
    box-sizing: border-box;
    overflow: hidden;
    display: flex;
    align-items: center;
    font: 400 11px/1.6 var(--pix);
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 46px; padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: content-box; }
  .score {
    margin: 0;
    color: #ffffff;
    font: 400 9px/1.6 var(--pix);
    letter-spacing: 0.04em;
    text-shadow: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink);
  }
  #again {
    font: 400 11px/1 var(--pix);
    color: var(--ink);
    background: var(--gold);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 12px 12px;
    cursor: pointer;
  }
  #again:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  #again:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
</style>

<canvas id="bg" aria-hidden="true"></canvas>

<main id="stage">
  <header class="huds" id="huds">
    <section class="hud" id="hudHero" data-level="hi" aria-label="Hero health and mana">
      <h2>HERO</h2>
      <div class="bar" id="hBar" role="progressbar" aria-label="Hero HP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="trail" id="hTrail"></i><i class="fill" id="hFill" data-level="hi"></i></div>
      <p class="hp"><span>HP</span><span><b id="hHp">100</b> / <span id="hMax">100</span></span></p>
      <div class="bar mpbar" id="hMpBar" role="progressbar" aria-label="Hero MP" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60"><i class="trail" id="hMpTrail"></i><i class="fill mpfill" id="hMpFill"></i></div>
      <p class="hp mp"><span>MP</span><span><b id="hMp">60</b> / <span id="hMpMax">60</span></span></p>
      <div class="chips" id="hChips"></div>
    </section>
    <section class="hud" id="hudGob" data-level="hi" aria-label="Fire Goblin health and mana">
      <h2>FIRE GOBLIN</h2>
      <div class="bar" id="gBar" role="progressbar" aria-label="Fire Goblin HP" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i class="trail" id="gTrail"></i><i class="fill" id="gFill" data-level="hi"></i></div>
      <p class="hp"><span>HP</span><span><b id="gHp">100</b> / <span id="gMax">100</span></span></p>
      <div class="bar mpbar" id="gMpBar" role="progressbar" aria-label="Fire Goblin MP" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60"><i class="trail" id="gMpTrail"></i><i class="fill mpfill" id="gMpFill"></i></div>
      <p class="hp mp"><span>MP</span><span><b id="gMp">60</b> / <span id="gMpMax">60</span></span></p>
      <div class="chips" id="gChips"></div>
    </section>
  </header>

  <div class="arena" id="arena">
    <canvas id="cv" role="img" aria-label="A pixel-art hero and a fire goblin casting spells in a forest clearing"></canvas>
    <p class="banner" id="banner" hidden></p>
  </div>

  <footer class="foot" id="foot">
    <p class="log" id="log" role="status" aria-live="polite">Loading sprites</p>
    <div class="row">
      <p class="score" id="score">Wins: Hero 0 / Fire Goblin 0</p>
      <button id="again" type="button" hidden>Fight again</button>
    </div>
  </footer>
</main>

<canvas id="fx" aria-hidden="true"></canvas>

<script>
(function () {
  'use strict';
  const CELL = 32;
  const MAX_HP = 100, MAX_MP = 60, DMG_MIN = 8, DMG_MAX = 18;
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const arena = $('arena'), stage = $('stage'), banner = $('banner');
  const logEl = $('log'), scoreEl = $('score'), againBtn = $('again');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ====================================================================
  //  Spells
  // ====================================================================
  const SPELLS = {
    hero: [
      { id: 'fire', name: 'Fire', shout: 'FIREBALL!', chip: 'F', cost: 10, min: 15, max: 24, rgb: [255, 150, 50], bub: '#ffb347', settle: 650 },
      { id: 'ice', name: 'Ice', shout: 'FROST LANCE!', chip: 'I', cost: 12, min: 14, max: 22, rgb: [120, 222, 255], bub: '#bfefff', settle: 800 },
      { id: 'bolt', name: 'Lightning', shout: 'THUNDER!', chip: 'L', cost: 18, min: 22, max: 32, rgb: [255, 238, 110], bub: '#fff27a', settle: 650 }
    ],
    gob: [
      { id: 'fireball', name: 'Fireball', shout: 'FIREBALL!', chip: 'F', cost: 8, min: 14, max: 22, rgb: [255, 130, 40], bub: '#ffb347', settle: 650 },
      { id: 'wave', name: 'Flame Wave', shout: 'FLAME WAVE!', chip: 'W', cost: 14, min: 18, max: 26, rgb: [255, 95, 35], bub: '#ff9b5e', settle: 800 },
      { id: 'meteor', name: 'Meteor', shout: 'METEOR!', chip: 'M', cost: 24, min: 28, max: 38, rgb: [255, 70, 30], bub: '#ff7a5c', settle: 1100 }
    ]
  };
  // what the target looks like when a spell lands
  const IMPACT = {
    fire:     { tint: 'burn',  ms: 900, flash: 'rgba(255,215,150,0.85)' },
    fireball: { tint: 'burn',  ms: 900, flash: 'rgba(255,215,150,0.85)' },
    wave:     { tint: 'burn',  ms: 1000, flash: 'rgba(255,200,130,0.85)' },
    meteor:   { tint: 'blast', ms: 1000, flash: 'rgba(255,235,190,0.9)' },
    ice:      { tint: 'ice',   ms: 560, flash: 'rgba(205,246,255,0.85)' },
    bolt:     { tint: 'shock', ms: 420, flash: 'rgba(255,255,225,0.9)' }
  };

  // ====================================================================
  //  Fighters
  // ====================================================================
  const heroImg = new Image(), gobImg = new Image();
  heroImg.src = 'hero.png';
  gobImg.src = 'goblin.png';

  function actor(o) {
    return Object.assign({
      anim: 'idle', t0: 0, hp: MAX_HP, shown: MAX_HP, mp: MAX_MP, shownMp: MAX_MP, victory: false,
      shiftT: -1e9, wins: 0, tint: null, flashCol: null, bubble: null, chips: []
    }, o);
  }
  function hudOf(p) {
    return {
      panel: $('hud' + (p === 'h' ? 'Hero' : 'Gob')), bar: $(p + 'Bar'), fill: $(p + 'Fill'), trail: $(p + 'Trail'), hp: $(p + 'Hp'), max: $(p + 'Max'),
      mpBar: $(p + 'MpBar'), mpFill: $(p + 'MpFill'), mpTrail: $(p + 'MpTrail'), mp: $(p + 'Mp'), mpMax: $(p + 'MpMax'), chips: $(p + 'Chips')
    };
  }
  const hero = actor({
    name: 'Hero', side: 1, img: heroImg, rows: { idle: 8, attack: 7, hurt: 9, ko: 10, cast: 11 },
    spells: SPELLS.hero, hud: hudOf('h')
  });
  const gob = actor({
    name: 'Fire Goblin', side: -1, img: gobImg, rows: { idle: 0, attack: 1, hurt: 2, ko: 3, cast: 4 },
    spells: SPELLS.gob, hud: hudOf('g')
  });
  const actors = [hero, gob];
  actors.forEach(function (a) {
    a.hud.max.textContent = MAX_HP;
    a.hud.mpMax.textContent = MAX_MP;
    a.chips = a.spells.map(function (sp) {
      const el = document.createElement('span');
      el.className = 'chip';
      el.style.setProperty('--c', 'rgb(' + sp.rgb.join(',') + ')');
      el.innerHTML = sp.chip + '<small>' + sp.cost + '</small>';
      el.title = sp.name + ' - ' + sp.cost + ' MP';
      el.setAttribute('aria-label', sp.name + ', costs ' + sp.cost + ' MP');
      a.hud.chips.appendChild(el);
      return { el: el, cost: sp.cost, id: sp.id };
    });
  });

  const ATT = [170, 120, 90, 200];        // wind-up, overhead, slash, follow-through (ms)
  const LUNGE = [0, 3, 9, 7];             // sprite pixels toward the opponent
  const CAST = [180, 320, 130, 260];      // raise, charge, release, recover
  const HURT = [90, 90, 90, 90], KNOCK = [2, 3, 2, 1];
  const KO = [150, 150, 150, 1e9], KO_SLIDE = [2, 4, 6, 7];

  function frameIn(ms, dt) {
    let f = 0;
    while (f < ms.length - 1 && dt >= ms[f]) { dt -= ms[f]; f++; }
    return f;
  }
  function setAnim(a, anim) { a.anim = anim; a.t0 = performance.now(); }

  function pose(a, now) {
    const dt = now - a.t0;
    let f = 0, dx = 0, dy = 0, flash = false;
    if (a.anim === 'attack') {
      f = frameIn(ATT, dt); dx = LUNGE[f] * a.side;
    } else if (a.anim === 'cast') {
      f = frameIn(CAST, dt); dx = (f === 2 ? 2 : 0) * a.side;
    } else if (a.anim === 'hurt') {
      f = frameIn(HURT, dt); dx = -KNOCK[f] * a.side; flash = dt < 110;
    } else if (a.anim === 'ko') {
      f = frameIn(KO, dt); dx = -KO_SLIDE[f] * a.side; flash = dt < 110;
    } else {
      f = Math.floor(dt / 220) % 4;
      const ds = now - a.shiftT;
      if (ds >= 0 && ds < 260) dx = -Math.round(Math.sin((ds / 260) * Math.PI) * 4) * a.side;   // dodge
      if (a.victory) dy = -Math.round(Math.abs(Math.sin(dt / 170)) * 3);
    }
    return { f: f, dx: dx, dy: dy, flash: flash };
  }

  // colour laid over a fighter's sprite: hit flash first, then the lingering spell effect
  function overlay(a, now, p) {
    if (p.flash) return a.flashCol || 'rgba(255,255,255,0.8)';
    const t = a.tint;
    if (!t) return null;
    if (now >= t.until) { a.tint = null; return null; }
    if (t.mode === 'burn') return 'rgba(255,' + Math.round(120 + 50 * Math.sin(now / 70)) + ',30,' + (0.3 + 0.12 * Math.sin(now / 55)).toFixed(2) + ')';
    if (t.mode === 'ice') return 'rgba(130,222,255,0.55)';
    if (t.mode === 'shock') return (reduce || Math.floor(now / 140) % 2 === 0) ? 'rgba(255,255,200,0.6)' : null;
    if (t.mode === 'blast') return 'rgba(255,150,50,' + (0.55 * (t.until - now) / t.ms).toFixed(2) + ')';
    return null;
  }

  let dev = 1, dpr = 1;
  const tmp = document.createElement('canvas');
  tmp.width = CELL; tmp.height = CELL;
  const tctx = tmp.getContext('2d');

  function drawShadow(a) {
    const baseX = a.side === 1 ? 0 : cv.width - CELL * dev;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(baseX + 16 * dev, 28 * dev, 7 * dev, 1.6 * dev, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawActor(a, now) {
    const p = pose(a, now);
    const baseX = a.side === 1 ? 0 : cv.width - CELL * dev;
    const x = baseX + p.dx * dev, y = p.dy * dev;
    const sy = a.rows[a.anim] * CELL;
    const ov = overlay(a, now, p);
    if (ov) {
      tctx.globalCompositeOperation = 'source-over';
      tctx.clearRect(0, 0, CELL, CELL);
      tctx.drawImage(a.img, p.f * CELL, sy, CELL, CELL, 0, 0, CELL, CELL);
      tctx.globalCompositeOperation = 'source-atop';
      tctx.fillStyle = ov;
      tctx.fillRect(0, 0, CELL, CELL);
      tctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(tmp, 0, 0, CELL, CELL, x, y, CELL * dev, CELL * dev);
    } else {
      ctx.drawImage(a.img, p.f * CELL, sy, CELL, CELL, x, y, CELL * dev, CELL * dev);
    }
  }

  function popup(a, text, kind) {
    const el = document.createElement('div');
    el.className = 'pop' + (kind ? ' ' + kind : '');
    el.textContent = text;
    const unit = dev / dpr;
    el.style.left = (a.side === 1 ? 16 * unit : cv.width / dpr - 16 * unit) + 'px';
    el.style.top = 8 * unit + 'px';
    arena.appendChild(el);
    setTimeout(function () { el.remove(); }, 1000);
  }

  function showBubble(a, sp) {
    hideBubble(a);
    const el = document.createElement('div');
    el.className = 'bubble';
    el.textContent = sp.shout;
    el.style.setProperty('--bub', sp.bub);
    arena.appendChild(el);
    const unit = dev / dpr, aw = cv.width / dpr, w = el.offsetWidth || 110;
    const cx = a.side === 1 ? 16 * unit : aw - 16 * unit;
    el.style.left = Math.max(w / 2 + 2, Math.min(aw - w / 2 - 2, cx)) + 'px';
    el.style.top = 9 * unit + 'px';
    a.bubble = el;
  }
  function hideBubble(a) {
    if (a.bubble) { a.bubble.remove(); a.bubble = null; }
  }

  // ---------- bars ----------
  function renderBar(a) {
    const pct = Math.max(0, a.hp) / MAX_HP * 100;
    const level = pct > 50 ? 'hi' : pct > 25 ? 'mid' : 'lo';
    a.hud.fill.style.width = pct + '%';
    a.hud.trail.style.width = pct + '%';
    a.hud.fill.dataset.level = level;
    a.hud.panel.dataset.level = level;
    a.hud.bar.setAttribute('aria-valuenow', String(Math.round(pct)));
  }
  function renderMp(a) {
    const pct = Math.max(0, a.mp) / MAX_MP * 100;
    a.hud.mpFill.style.width = pct + '%';
    a.hud.mpTrail.style.width = pct + '%';
    a.hud.mpBar.setAttribute('aria-valuenow', String(Math.round(a.mp)));
    a.chips.forEach(function (c) { c.el.classList.toggle('off', a.mp < c.cost); });
  }
  function resetBarsInstant() {
    actors.forEach(function (a) {
      const els = [a.hud.fill, a.hud.trail, a.hud.mpFill, a.hud.mpTrail];
      els.forEach(function (e) { e.style.transition = 'none'; });
      renderBar(a); renderMp(a);
      void a.hud.bar.offsetWidth;
      els.forEach(function (e) { e.style.transition = ''; });
    });
  }
  function pulseChip(a, id) {
    a.chips.forEach(function (c) {
      if (c.id !== id) return;
      c.el.classList.remove('used'); void c.el.offsetWidth; c.el.classList.add('used');
    });
  }

  // ====================================================================
  //  Forest backdrop (pixel art, drawn at half the fighters' pixel size)
  // ====================================================================
  const bgCv = $('bg'), bctx = bgCv.getContext('2d');
  const L = document.createElement('canvas'), lg = L.getContext('2d');
  const motion = reduce ? 0.25 : 1;
  const swayOn = reduce ? 0 : 1;
  let scene = null, sdev = 3;
  const HAZE = '#c4e3d2';

  function rng(seed) {
    let a = seed >>> 0;
    const o = {
      f: function () {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },

  function mk(w, h) {

  function disc(c, cx, cy, r, col) {

  const PAL_ROUND = { dark: '#1b5233', mid: '#2b7640', light: '#459c48', hi: '#a6d65e' };
  const PAL_PINE = { dark: '#14452d', mid: '#216039', light: '#37804a', hi: '#6fb064' };
  const PAL_DEEP = { dark: '#0f3a24', mid: '#17502e', light: '#226a3a', hi: '#4a9a49' };
  const PAL_TRUNK = { dark: '#3d2616', mid: '#5a3a22', light: '#7d5535' };

  function buildRound(r, R, pal) {

      const a = r.f() * Math.PI * 2, d = R * (0.5 + r.f() * 0.45);

    }

  function buildPine(r, H, pal) {

  function buildScene(cols, rows, fy, cx, halfW) {
    const r = rng(20261015);
    const hr = Math.max(Math.round(rows * 0.3), Math.round(fy - rows * 0.14));   // horizon row
    const S = { cols: cols, rows: rows, fy: fy, cx: cx, hr: hr };

    // ---- sky ----
    const SKY = ['#58b0e6', '#74c0ec', '#92cff1', '#b0def4', '#cdebf5', '#e4f3ef', '#f6f1d4', '#ffeeb8'];
    const skyH = hr + 8;
    const sky = mk(cols, skyH);
    for (let y = 0; y < skyH; y++) {
      const p = y / (skyH - 1) * (SKY.length - 1);
      const b = Math.min(SKY.length - 2, Math.floor(p)), fr = p - b;
      if (fr <= 0.7) {

    }
    S.sky = sky.c;

    // ---- distant haze ----
    const haze = mk(cols, rows);
    for (let x = -10; x < cols + 10; x += 6 + r.int(8)) {
      const R = 10 + r.int(9), cy = hr - 6 - r.int(10);
      disc(haze.x, x, cy, R, '#b9ddc9');
      disc(haze.x, x - 1, cy - 2, Math.max(2, R - 2), '#c6e4d3');
    }
    for (let x = -6; x < cols + 10; x += 5 + r.int(7)) {

      disc(haze.x, x - 1, cy - 2, Math.max(2, R - 2), '#b0d6bf');
    }
    S.haze = haze.c;

    // ---- ground with the clearing ----
    const ground = mk(cols, rows);
    const G_FAR = ['#a8d07a', '#97c46c', '#88b861'], G_MID = ['#7cbb4c', '#69a640', '#589436'], G_NEAR = ['#4a8a34', '#3d7a2d', '#326a27'];

    function add(o) {

      const cn = o.kind === 'pine' ? buildPine(r, o.size, pal) : buildRound(r, o.size, pal);

    });
    [[0.05, 3, 24], [0.22, -2, 20], [0.78, -3, 21], [0.95, 4, 25]].forEach(function (p) {

      trees[trees.length - 1].cyAbs = p[1] + 2;
    });
    // foreground bushes at the bottom corners
    [[0.03], [0.14], [0.86], [0.97]].forEach(function (p) {

      trees[trees.length - 1].base = rows + 30 + Math.round(p[0] * 10);
      trees[trees.length - 1].cyAbs = rows - 2;
    });
    trees.sort(function (a, b) { return a.base - b.base; });
    S.trees = trees;

    // ---- clouds ----
    S.clouds = [];
    for (let i = 0; i < 3; i++) {
      const m = mk(34, 14);
      const w = 8 + r.int(5);
      [[w, 8, 5], [w + 7, 6, 6], [w + 14, 8, 5], [w + 4, 9, 4], [w + 11, 9, 4]].forEach(function (b) { disc(m.x, b[0], b[1], b[2], '#d6ecf7'); });
      [[w, 7, 5], [w + 7, 5, 6], [w + 14, 7, 5], [w + 4, 8, 4], [w + 11, 8, 4]].forEach(function (b) { disc(m.x, b[0], b[1], b[2], '#ffffff'); });
      S.clouds.push({ c: m.c, x0: r.f() * (cols + 40), y: Math.round(rows * (0.04 + 0.05 * i) + r.int(8)), v: 1.2 + r.f() * 1.6 });
    }
    // ---- birds ----
    S.birds = [0, 1].map(function (i) {
      return { y: Math.round(rows * (0.07 + 0.06 * i)), v: 11 + r.f() * 5, off: i * 9 + r.f() * 4, gap: 6 + r.f() * 6 };
    });
    // ---- leaves and fireflies ----
    const LEAF = ['#8fd05a', '#c9a43a', '#d9822b', '#5aa046'];
    S.leaves = [];
    for (let i = 0; i < 12; i++) {
      S.leaves.push({ x0: r.f() * cols, y0: r.f() * rows, vy: 4 + r.f() * 5, ph: r.f() * 6.28, amp: 5 + r.f() * 8, col: LEAF[r.int(LEAF.length)] });
    }

    for (let i = 0; i < 16; i++) {
      S.flies.push({ x0: cols * (0.08 + r.f() * 0.84), y0: fy - 8 - r.f() * 60, ax: 4 + r.f() * 10, ay: 3 + r.f() * 7, fx: 0.3 + r.f() * 0.5, fy: 0.3 + r.f() * 0.5, tw: 1 + r.f() * 2, ph: r.f() * 6.28 });

      { dx: -22, w: 7, sl: 0.30, a: 0.09, ph: 0.0, sp: 0.5 },
      { dx: -8, w: 11, sl: 0.34, a: 0.12, ph: 1.7, sp: 0.4 },
      { dx: 9, w: 8, sl: 0.28, a: 0.10, ph: 3.1, sp: 0.6 },

  }

  function drawScene(now) {
    const S = scene;
    if (!S) return;
    const t = (now / 1000) * motion;
    const cols = S.cols, rows = S.rows;
    lg.globalAlpha = 1;
    lg.globalCompositeOperation = 'source-over';
    lg.clearRect(0, 0, cols, rows);
    lg.drawImage(S.sky, 0, 0);

    S.clouds.forEach(function (c) {

      lg.drawImage(c.c, Math.round(x), c.y);
    });
    lg.fillStyle = '#243824';
    S.birds.forEach(function (b) {
      const cycle = (cols + 24) / b.v + b.gap;
      const ph = ((t + b.off) % cycle + cycle) % cycle;
      const x = ph * b.v - 12;
      if (x > cols + 6) return;

      } else {
        lg.fillRect(bx - 1, by + 1, 1, 1); lg.fillRect(bx, by, 1, 1); lg.fillRect(bx + 1, by, 1, 1); lg.fillRect(bx + 2, by, 1, 1); lg.fillRect(bx + 3, by + 1, 1, 1);
      }
    });

    lg.drawImage(S.haze, 0, 0);
    lg.drawImage(S.ground, 0, 0);

    S.tufts.forEach(function (u) {
      const sw = Math.round(Math.sin(t * 1.6 + u.ph + u.x * 0.05) * 1.2 * swayOn);
      lg.fillStyle = u.col;
      lg.fillRect(u.x, u.y, 1, 3);
      lg.fillRect(u.x - 2, u.y + 1, 1, 2);
      lg.fillRect(u.x + 2, u.y + 1, 1, 2);
      lg.fillRect(u.x + sw, u.y - 1, 1, 1);
      lg.fillRect(u.x - 2 + sw, u.y, 1, 1);
      lg.fillRect(u.x + 2 + sw, u.y, 1, 1);
    });

    S.trees.forEach(function (tr) {
      const sw = Math.round(Math.sin(t * 0.8 + tr.ph) * tr.amp * swayOn);
      if (tr.tr) lg.drawImage(tr.tr.c, Math.round(tr.x - tr.tr.w / 2), tr.base - tr.trunkH);
      const cn = tr.cn;
      if (tr.kind === 'pine') {
        lg.drawImage(cn.c, Math.round(tr.x - cn.cx + sw), tr.base - tr.trunkH + 3 - cn.h);
      } else {
        const cy = tr.cyAbs !== undefined ? tr.cyAbs : tr.base - tr.trunkH;
        lg.drawImage(cn.c, Math.round(tr.x - cn.cx + sw), Math.round(cy - cn.cy));
      }
    });

    // light shafts
    lg.globalCompositeOperation = 'lighter';
    S.shafts.forEach(function (s) {
      const a = s.a * (0.6 + 0.4 * Math.sin(t * s.sp + s.ph));
      lg.fillStyle = 'rgba(255,236,160,' + a.toFixed(3) + ')';
      const x0 = S.cx + s.dx - s.w / 2 + Math.sin(t * 0.2 + s.ph) * 2, yb = S.fy + 4, x1 = x0 + s.sl * yb;
      lg.beginPath();
      lg.moveTo(x0, 0); lg.lineTo(x0 + s.w, 0);
      lg.lineTo(x1 + s.w * 1.8, yb); lg.lineTo(x1, yb);
      lg.closePath(); lg.fill();
    });
    lg.globalCompositeOperation = 'source-over';

    // fireflies
    S.flies.forEach(function (f) {
      const x = Math.round(f.x0 + Math.sin(t * f.fx + f.ph) * f.ax), y = Math.round(f.y0 + Math.cos(t * f.fy + f.ph) * f.ay);
      const a = Math.pow(0.5 + 0.5 * Math.sin(t * f.tw + f.ph), 2);
      lg.globalAlpha = 0.25 + 0.75 * a;
      lg.fillStyle = '#fff6a8'; lg.fillRect(x, y, 1, 1);
      if (a > 0.6) {
        lg.globalAlpha = 0.3 * a;
        lg.fillRect(x - 1, y, 1, 1); lg.fillRect(x + 1, y, 1, 1); lg.fillRect(x, y - 1, 1, 1); lg.fillRect(x, y + 1, 1, 1);
      }
    });
    lg.globalAlpha = 1;

    // falling leaves
    const span = rows + 12;
    S.leaves.forEach(function (l) {
      const y = ((l.y0 + l.vy * t) % span + span) % span - 6;
      const x = l.x0 + Math.sin(t * 0.9 + l.ph) * l.amp;
      const fr = Math.floor(t * 3 + l.ph) % 3;

      dimRgb = '70,8,0'; dimTarget = 0.38 * CALM;
      addObj(WARN + FALL + 0.06, function (dt, age, k, o) {
        if (age < WARN) {
          const w = age / WARN;
          addMode();
          glow(start.x, 0, 20 * dev, '255,90,30', 0.4 * w);
          fg.lineWidth = fxPx * 1.5; fg.strokeStyle = 'rgba(255,90,40,' + (0.35 + 0.35 * Math.sin(age * 22)).toFixed(3) + ')';
          fg.beginPath(); fg.ellipse(feet.x, feet.y, 11 * dev * w, 4 * dev * w, 0, 0, TAU); fg.stroke();
          normMode();
          return;
        }
        const kk = Math.min(1, (age - WARN) / FALL), e = kk * kk;
        const x = lerp(start.x, to.x, e), y = lerp(start.y, to.y, e);
        const dir = Math.atan2(to.y - start.y, to.x - start.x);
        addMode();
        glow(x, y, 15 * dev, '255,110,40', 0.55);
        glow(x, y, 7 * dev, '255,220,140', 0.7);
        pdisc(x, y, 3.6 * dev, '#ff6a1f');
        pdisc(x - Math.cos(dir) * dev, y - Math.sin(dir) * dev, 2.4 * dev, '#ffd23f');
        pdisc(x, y, 1.4 * dev, '#fff6d0');
        normMode();
        emit(x, y, { n: 8, sp: [8, 40], ang: [dir + Math.PI - 0.45, dir + Math.PI + 0.45], life: [0.3, 0.8], s: [1.5, 3.4], c0: [255, 230, 130], c1: [200, 35, 10], d: 1.2 });
        emit(x, y, { n: 2, sp: [4, 14], ang: [dir + Math.PI - 0.6, dir + Math.PI + 0.6], life: [0.6, 1.1], s: [3, 4], c0: [80, 60, 55], c1: [25, 22, 24], add: false, a: 0.5 });
        if (kk >= 1 && !o.fired) {
          o.fired = true;
          addFlash('255,235,190', 0.55); dimTarget = 0;
          boom(to.x, to.y, feet.y, 2, { a: [255, 240, 160], b: [200, 40, 12], glow: '255,120,40', ring: '255,170,90', flash: '255,225,170' });
          emit(to.x, feet.y, { n: 22, sp: [40, 110], ang: [-Math.PI * 0.95, -Math.PI * 0.05], life: [0.6, 1.2], s: [1.5, 2.6], c0: [150, 100, 70], c1: [45, 30, 25], g: 220, add: false, a: 0.95 });
          addShake(14);
          // scorched crater that glows and cools
          addObj(1.8, function (dt2, age2, k2) {
            fg.fillStyle = 'rgba(25,10,5,' + (0.5 * (1 - k2)).toFixed(3) + ')';
            fg.beginPath(); fg.ellipse(feet.x, feet.y, 12 * dev, 3.6 * dev, 0, 0, TAU); fg.fill();
            addMode(); glow(feet.x, feet.y, 12 * dev, '255,110,30', 0.35 * (1 - k2)); normMode();
          });
          for (let j = -3; j <= 3; j++) flameColumn(feet.x + j * 3.2 * dev, feet.y + (Math.abs(j) % 2) * dev * 0.6, 0.05 * Math.abs(j), 0.9, null);
          res();
        }
      });
    });
  }

  const CAST_FX = {
    fire: function (a, d, sp) { return fireProjectile(a, d, sp, false); },
    fireball: function (a, d, sp) { return fireProjectile(a, d, sp, true); },
    ice: iceVolley, bolt: lightning, wave: flameWave, meteor: meteor
  };

  function stageShake(sx, sy) {
    const v = sx || sy ? 'translate(' + sx + 'px,' + sy + 'px)' : '';
    stage.style.transform = v;
    bgCv.style.transform = v;
  }
  function fxClear() {
    parts.length = 0; objs.length = 0; flashA = 0; dimA = 0; dimTarget = 0; shakeMag = 0;
    fg.setTransform(1, 0, 0, 1, 0, 0);
    fg.clearRect(0, 0, fxCv.width, fxCv.height);
    stageShake(0, 0);
  }
  function fxFrame(now) {
    const dt = Math.min(0.05, (now - fxLast) / 1000 || 0.016);
    fxLast = now;
    const active = objs.length || parts.length || flashA > 0.004 || dimA > 0.004 || dimTarget > 0 || shakeMag > 0.2;
    if (!active) {
      if (fxDirty) { fg.clearRect(0, 0, fxCv.width, fxCv.height); fxDirty = false; stageShake(0, 0); }
      return;
    }
    fxDirty = true;
    normMode();
    fg.clearRect(0, 0, fxCv.width, fxCv.height);
    dimA += (dimTarget - dimA) * Math.min(1, dt * 7);
    if (dimA > 0.004) { fg.fillStyle = 'rgba(' + dimRgb + ',' + dimA.toFixed(3) + ')'; fg.fillRect(0, 0, fxCv.width, fxCv.height); }

    for (let i = objs.length - 1; i >= 0; i--) {
      const o = objs[i];
      o.age += dt;
      const k = Math.min(1, o.age / o.life);
      o.fn(dt, o.age, k, o);
      normMode();
      if (o.age >= o.life) objs.splice(i, 1);
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.age += dt;
      if (p.age >= p.life) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
      const dr = Math.max(0, 1 - p.d * dt);
      p.vx *= dr; p.vy *= dr; p.vy += p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (let pass = 0; pass < 2; pass++) {
      fg.globalCompositeOperation = pass ? 'lighter' : 'source-over';
      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        if (p.add !== !!pass) continue;
        const t = p.age / p.life;
        const al = p.a * Math.pow(1 - t, 1.1);
        fg.fillStyle = 'rgba(' + Math.round(lerp(p.c0[0], p.c1[0], t)) + ',' + Math.round(lerp(p.c0[1], p.c1[1], t)) + ',' + Math.round(lerp(p.c0[2], p.c1[2], t)) + ',' + al.toFixed(3) + ')';
        const sz = Math.max(1, Math.round(p.s)) * fxPx;
        fg.fillRect(snap(p.x), snap(p.y), sz, sz);
      }
    }
    normMode();
    if (flashA > 0.004) {
      fg.fillStyle = 'rgba(' + flashRgb + ',' + Math.min(0.9, flashA).toFixed(3) + ')';
      fg.fillRect(0, 0, fxCv.width, fxCv.height);
      flashA = Math.max(0, flashA - dt * 3.2);
    }
    if (shakeMag > 0.2) {
      stageShake(Math.round(rnd(-shakeMag, shakeMag)), Math.round(rnd(-shakeMag, shakeMag)));
      shakeMag *= Math.pow(0.02, dt);
    } else if (shakeMag > 0) { shakeMag = 0; stageShake(0, 0); }
  }

  // ====================================================================
  //  Layout
  // ====================================================================
  function layout() {
    dpr = window.devicePixelRatio || 1;
    const aw = stage.clientWidth;
    let s = Math.floor(aw / 58);
    s = Math.max(3, Math.min(s, Math.floor((window.innerHeight * 0.36) / CELL)));
    if (s >= 4 && s % 2 === 1) s -= 1;            // keeps the forest pixel exactly half a fighter pixel
    dev = Math.max(1, Math.round(s * dpr));
    cv.width = Math.round(aw * dpr);
    cv.height = CELL * dev;
    cv.style.width = cv.width / dpr + 'px';
    cv.style.height = cv.height / dpr + 'px';
    arena.style.width = cv.style.width;
    ctx.imageSmoothingEnabled = false;

    // forest
    sdev = Math.max(1, Math.floor(dev / 2));
    fxPx = sdev;
    const W = Math.round(window.innerWidth * dpr), H = Math.round(window.innerHeight * dpr);
    fxCv.width = W; fxCv.height = H;
    const cols = Math.ceil(W / sdev), rows = Math.ceil(H / sdev);
    bgCv.width = cols * sdev; bgCv.height = rows * sdev;
    bgCv.style.width = bgCv.width / dpr + 'px'; bgCv.style.height = bgCv.height / dpr + 'px';
    L.width = cols; L.height = rows;
    const rect = cv.getBoundingClientRect();
    const fy = (rect.top * dpr + 28 * dev) / sdev;
    const cx = (rect.left + rect.width / 2) * dpr / sdev;
    const halfW = rect.width * dpr / sdev / 2;
    scene = buildScene(cols, rows, Math.round(fy), Math.round(cx), halfW);
  }
  let layoutQueued = false;
  function queueLayout() {
    if (layoutQueued) return;
    layoutQueued = true;
    requestAnimationFrame(function () { layoutQueued = false; layout(); });
  }

  // ====================================================================
  //  Battle
  // ====================================================================
  let ready = false, battleId = 0, countdown = null;
  const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms * (reduce ? 1.4 : 1)); }); };
  const say = function (t) { logEl.textContent = t; };

  // each turn: a random affordable spell most of the time, otherwise a plain strike
  function chooseSpell(a) {
    const opts = a.spells.filter(function (s) { return a.mp >= s.cost; });
    if (opts.length && Math.random() < 0.75) return opts[Math.floor(Math.random() * opts.length)];
    return null;
  }
  function rollDamage(lo, hi) {
    let dmg = lo + Math.floor(Math.random() * (hi - lo + 1)), kind = '';
    if (Math.random() < 0.12) { dmg = Math.round(dmg * 1.6); kind = 'crit'; }
    return { dmg: dmg, kind: kind };
  }
  function hit(def, dmg, kind, imp) {
    def.hp = Math.max(0, def.hp - dmg);
    renderBar(def);
    popup(def, '-' + dmg, kind);
    def.flashCol = imp ? imp.flash : null;
    def.tint = imp ? { mode: imp.tint, until: performance.now() + imp.ms, ms: imp.ms } : null;
    setAnim(def, def.hp > 0 ? 'hurt' : 'ko');
    if (def.hp > 0) {
      setTimeout(function () { if (def.anim === 'hurt') setAnim(def, 'idle'); }, 380);
    }
  }

  async function castTurn(atk, def, sp, alive) {
    atk.mp -= sp.cost;
    renderMp(atk);
    pulseChip(atk, sp.id);
    setAnim(atk, 'cast');
    showBubble(atk, sp);
    say(atk.name + ' casts ' + sp.name + '!');
    charge(atk, sp);
    await sleep(560); if (!alive()) return false;
    await CAST_FX[sp.id](atk, def, sp); if (!alive()) return false;
    const r = rollDamage(sp.min, sp.max);
    hideBubble(atk);
    hit(def, r.dmg, r.kind, IMPACT[sp.id]);
    say(atk.name + '\'s ' + sp.name + ' hits ' + def.name + ' for ' + r.dmg + (r.kind === 'crit' ? ' - critical!' : '!'));
    await sleep(sp.settle); if (!alive()) return false;
    hideBubble(atk);
    setAnim(atk, 'idle');
    return true;
  }

  async function battle() {
    const id = ++battleId;
    const alive = function () { return id === battleId; };
    clearInterval(countdown);
    againBtn.hidden = true;
    banner.hidden = true;
    fxClear();
    const t = performance.now();
    actors.forEach(function (a) {
      a.hp = MAX_HP; a.shown = MAX_HP; a.mp = MAX_MP; a.shownMp = MAX_MP;
      a.anim = 'idle'; a.t0 = t; a.victory = false; a.shiftT = -1e9; a.tint = null; a.flashCol = null;
      hideBubble(a);
    });
    resetBarsInstant();

    let atk = Math.random() < 0.5 ? hero : gob;
    let def = atk === hero ? gob : hero;
    say(atk.name + ' goes first!');
    await sleep(1300); if (!alive()) return;

    for (;;) {
      const sp = chooseSpell(atk);
      if (sp) {
        if (!(await castTurn(atk, def, sp, alive))) return;
      } else {
        setAnim(atk, 'attack');
        say(atk.name + ' attacks!');
        await sleep(ATT[0] + ATT[1] + 40); if (!alive()) return;
        if (Math.random() < 0.10) {
          def.shiftT = performance.now();
          popup(def, 'MISS', 'miss');
          say(atk.name + ' misses! ' + def.name + ' dodges.');
        } else {
          const r = rollDamage(DMG_MIN, DMG_MAX);
          hit(def, r.dmg, r.kind, null);
          say(atk.name + ' hits ' + def.name + ' for ' + r.dmg + (r.kind === 'crit' ? ' - critical!' : '!'));
        }
        await sleep(ATT[2] - 40 + ATT[3]); if (!alive()) return;
        setAnim(atk, 'idle');
      }
      if (def.hp <= 0) break;
      await sleep(750); if (!alive()) return;
      const swap = atk; atk = def; def = swap;
    }

    await sleep(900); if (!alive()) return;
    atk.victory = true; atk.t0 = performance.now(); atk.wins++;
    banner.textContent = atk.name.toUpperCase() + ' WINS!';
    banner.hidden = false;
    say(def.name + ' is defeated. ' + atk.name + ' wins with ' + atk.hp + ' HP left!');
    scoreEl.textContent = 'Wins: Hero ' + hero.wins + ' / Fire Goblin ' + gob.wins;
    againBtn.hidden = false;
    let n = 8;
    againBtn.textContent = 'Fight again (' + n + ')';
    countdown = setInterval(function () {
      n--;
      if (n <= 0) { clearInterval(countdown); battle(); } else { againBtn.textContent = 'Fight again (' + n + ')'; }
    }, 1000);
  }
  againBtn.addEventListener('click', function () { battle(); });

  // ====================================================================
  //  Main loop
  // ====================================================================
  let lastBg = -1e9;
  function tick(now) {
    actors.forEach(function (a) {
      a.shown += (a.hp - a.shown) * 0.2;
      if (Math.abs(a.hp - a.shown) < 0.5) a.shown = a.hp;
      const txt = String(Math.round(a.shown));
      if (a.hud.hp.textContent !== txt) a.hud.hp.textContent = txt;
      a.shownMp += (a.mp - a.shownMp) * 0.2;
      if (Math.abs(a.mp - a.shownMp) < 0.5) a.shownMp = a.mp;
      const mt = String(Math.round(a.shownMp));
      if (a.hud.mp.textContent !== mt) a.hud.mp.textContent = mt;
    });

    if (now - lastBg >= 33) { lastBg = now; drawScene(now); }

    if (ready) {
      ctx.clearRect(0, 0, cv.width, cv.height);
      actors.forEach(drawShadow);
      actors.slice().sort(function (x, y) { return ((x.anim === 'attack' || x.anim === 'cast') ? 1 : 0) - ((y.anim === 'attack' || y.anim === 'cast') ? 1 : 0); })
        .forEach(function (a) { drawActor(a, now); });
    }
    fxFrame(now);
    requestAnimationFrame(tick);
  }

  function loaded(img) {
    return new Promise(function (res, rej) {
      if (img.complete && img.naturalWidth) res();
      else { img.onload = res; img.onerror = function () { rej(new Error('image')); }; }
    });
  }

  layout();
  window.addEventListener('resize', queueLayout);
  window.addEventListener('orientationchange', queueLayout);
  window.addEventListener('load', queueLayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueLayout);
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(queueLayout);
    ro.observe($('huds')); ro.observe($('foot'));
  }
  if (window.__duelDebug) window.__duelDebug({ hero: hero, gob: gob, SPELLS: SPELLS, CAST_FX: CAST_FX, charge: charge, fxFrame: fxFrame, drawScene: drawScene, drawActor: drawActor, drawShadow: drawShadow, setAnim: setAnim, hit: hit, IMPACT: IMPACT, showBubble: showBubble, actors: actors, stop: function () { battleId++; clearInterval(countdown); }, setReady: function () { ready = true; }, getCv: function () { return cv; } });
  requestAnimationFrame(tick);
  Promise.all([loaded(heroImg), loaded(gobImg)]).then(function () {
    ready = true;
    battle();
  }).catch(function () { say('The sprite sheets failed to load.'); });
})();
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
